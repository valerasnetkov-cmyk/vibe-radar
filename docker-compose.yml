services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: viberadar
      POSTGRES_USER: viberadar
      POSTGRES_PASSWORD: viberadar_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - viberadar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viberadar -d viberadar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  viberadar-postgres:
