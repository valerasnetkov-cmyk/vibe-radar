# Install only after the certificate files below exist. During ACME issuance,
# use a temporary HTTP-only server block for viberadar.ru and www.viberadar.ru.
server {
    listen 80;
    listen [::]:80;
    server_name viberadar.ru www.viberadar.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://viberadar.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.viberadar.ru;

    ssl_certificate /etc/letsencrypt/live/viberadar.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viberadar.ru/privkey.pem;

    return 301 https://viberadar.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name viberadar.ru;

    ssl_certificate /etc/letsencrypt/live/viberadar.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viberadar.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 65s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
